name: DevOne CMS 2.0

on:
  push:
    branches: [serverless-2.0]
  pull_request:
    branches: [serverless-2.0]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm run check
      - run: npm run test:core
      - run: npm run build
